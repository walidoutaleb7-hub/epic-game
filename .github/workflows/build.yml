name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      
      - name: Generate Flutter project files
        run: flutter create . --project-name epic_game --platforms android
      
      - name: Update Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version ".*"/org.jetbrains.kotlin.android" version "2.0.0"/' android/settings.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '2.0.0'/" android/build.gradle
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epic-game-apk
          path: build/app/outputs/flutter-apk/app-release.apk